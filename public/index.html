    <style>
      .key {
        display: flex;
        flex-direction: column; /* stack text vertically */
        justify-content: center;
        align-items: center;
        height: 60px;
        width: 60px;
        border: 2px solid #333;
        border-radius: 8px;
        background: #e0e0e0;
        font-family: sans-serif;
        font-size: 14px;
        cursor: pointer;
        box-shadow: 1px 2px 4px rgba(0,0,0,0.2);
        transition: background 0.2s;

        transition: all 0.2s;
        position: relative;
      }

      .key:hover {
        background: #d0d0d0;
      }

      .key:active {
        background: #b0b0b0;
        transform: translateY(2px);
      }

      .key.modifiable {
        /* border-color: #667eea; */
        box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
      }

      .key.modifiable::after {
          content: "⚙️";
        position: absolute;
        top: 2px;
        right: 2px;
        font-size: 10px;
        opacity: 1;
        pointer-events: none;
      }
      .context-menu {
        position: absolute;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        min-width: 160px;
        z-index: 1000;
        display: none;
        font-family: sans-serif;
      }

      /* Menu items */
      .context-menu ul {
        list-style: none;
        margin: 0;
        padding: 6px 0;
        
      }

      .context-menu li {

        padding: 6px 12px;
        cursor: pointer;
        position: relative;
        white-space: nowrap;
        right: 5px
      }

      .context-menu li:hover {
        background: #f0f0f0;
      }

      /* Submenu styling */
      .context-menu .submenu {
        display: none;
        position: absolute;
        top: 0;
        left: 100%;
        margin-left: 4px;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 6px;
        min-width: 140px;
      }

      .context-menu li:hover > .submenu {
        display: block;
      }
      .label {
        font-weight: bold;
        font-size: 16px;
      }

      .chord {
        font-size: 13px;
        color: darkred; /* make chords stand out */
      }

      .center-div {
        width: 50%; /* Example width, adjust as needed */
        margin: auto;
        /*border: 1px solid black; /* For visualization */
        padding: 20px;
        text-align: center; /* To center text within the div */
      }
      
      .dawArea {
        display: flex;
        justify-content: center; /* center horizontally */
        align-items: center;     /* center vertically */
        height: 100vh;           /* full viewport height */
        margin: 0;
        background: #fafafa;
      }

      .keyboard {
        display: flex;
        flex-direction: column;
        gap: 8px; /* space between rows */
        width: max-content;
      }

      .row {
        display: grid;
        grid-template-columns: repeat(7, 60px); /* 7 columns, each 60px wide */
        gap: 6px; /* spacing between keys */
      }

      .row:nth-child(2) {
        margin-left: 30px; /* stagger second row */
      }

      .row:nth-child(3) {
        margin-left: 60px; /* stagger third row */
      }

      .label {

          font-size: 16px;
      }

      /* Modifier Popup Styles */
      .modifier-popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        z-index: 1000;
        min-width: 350px;
        display: none;
      }

      .modifier-popup.show {
        display: block;
        animation: popIn 0.3s ease-out;
      }

      @keyframes popIn {
        from { 
          transform: translate(-50%, -50%) scale(0.8); 
          opacity: 0; 
        }
        to { 
          transform: translate(-50%, -50%) scale(1); 
          opacity: 1; 
        }
      }

      .popup-overlay {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0,0,0,0.5);
          z-index: 999;
          display: none;
      }

      .popup-overlay.show {
          display: block;
      }

      .popup-header {
          text-align: center;
          font-size: 24px;
          margin-bottom: 20px;
          color: #333;
          border-bottom: 2px solid #eee;
          padding-bottom: 10px;
      }

      .modifier-section {
          margin-bottom: 20px;
      }

      .modifier-section h3 {
          color: #666;
          margin-bottom: 10px;
          font-size: 16px;
          text-align: left;
      }

      .modifier-options {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
      }

      .modifier-btn {
          background: #f8f9fa;
          border: 2px solid #dee2e6;
          border-radius: 8px;
          padding: 8px 12px;
          font-size: 14px;
          cursor: pointer;
          transition: all 0.2s ease;
      }

      .modifier-btn:hover {
          background: #e9ecef;
          border-color: #adb5bd;
      }

      .modifier-btn.selected {
          background: #667eea;
          color: white;
          border-color: #667eea;
      }

      .root-note-selector {
          display: flex;
          flex-wrap: wrap;
          gap: 5px;
      }

      .root-note-btn {
          background: #fff;
          border: 1px solid #ddd;
          border-radius: 6px;
          padding: 6px 10px;
          font-size: 12px;
          cursor: pointer;
          min-width: 35px;
          text-align: center;
      }

      .root-note-btn:hover {
          background: #f0f0f0;
      }

      .root-note-btn.selected {
          background: #28a745;
          color: white;
          border-color: #28a745;
      }

      .popup-actions {
          display: flex;
          gap: 10px;
          justify-content: center;
          margin-top: 20px;
      }

      .action-btn {
          padding: 12px 24px;
          border: none;
          border-radius: 10px;
          font-size: 16px;
          cursor: pointer;
          transition: all 0.2s ease;
      }

      .apply-btn {
          background: #28a745;
          color: white;
      }

      .apply-btn:hover {
          background: #218838;
      }

      .cancel-btn {
          background: #6c757d;
          color: white;
      }

      .cancel-btn:hover {
          background: #545b62;
      }

      .mapper {
          margin: 20px 0;
          padding: 20px;
          background: white;
          border-radius: 10px;
          display: inline-block;
      }

      .mapper label {
          margin: 0 10px;
      }

      .mapper select {
          margin: 0 5px;
          padding: 5px;
          border-radius: 5px;
          border: 1px solid #ccc;
      }

      #generateButton {
          background: #667eea;
          color: white;
          border: none;
          padding: 10px 20px;
          border-radius: 5px;
          cursor: pointer;
          margin-left: 10px;
      }

      #generateButton:hover {
          background: #5a6fd8;
      }

      /* Extensions section */
      .extensions-section {
          margin-top: 15px;
      }

      .extension-btn {
          background: #fff3cd;
          border: 2px solid #ffeaa7;
          color: #856404;
      }

      .extension-btn.selected {
          background: #f39c12;
          color: white;
          border-color: #f39c12;
      }

      /* normal submenu (flies right) */
      .submenu {
        position: absolute;
        left: 100%;
        top: 0;
      }

      /* reversed submenu (flies left) */
      .submenu.reverse {
        left: auto;
        right: 100%;
      }

    </style>
